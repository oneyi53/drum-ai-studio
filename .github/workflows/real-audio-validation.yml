name: Real repository MP3 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe-real-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository test audio
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install CPU PyTorch and DrumScript
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/DrumScript/DrumScript.git /tmp/DrumScript
          git -C /tmp/DrumScript rev-parse HEAD
          python -m pip install -e /tmp/DrumScript
          python -m pip install pretty-midi

      - name: Transcribe both repository MP3 files
        run: python scripts/validate_repository_audio.py

      - name: Upload generated MIDI and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drumai-real-audio-validation
          path: real-audio-results/
          if-no-files-found: warn
