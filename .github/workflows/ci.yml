name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator test dependencies
        run: python -m pip install pytest pretty-midi
      - name: Test MIDI evaluation and real-audio export
        run: pytest scripts/tests -q

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm install
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start API and frontend
        run: |
          mkdir -p /tmp/drumai-e2e-data frontend/test-results
          cd backend
          DRUMAI_DATA_DIR=/tmp/drumai-e2e-data uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/drumai-api.log 2>&1 &
          cd ../frontend
          VITE_API_BASE_URL=http://127.0.0.1:8000 npm run dev -- --host 127.0.0.1 > /tmp/drumai-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/drumai-api.log
          cat /tmp/drumai-vite.log
          exit 1
      - name: Run browser end-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: Validate exported MusicXML against the W3C MusicXML 4.0 XSD
        run: |
          python -m pip install lxml
          mkdir -p /tmp/musicxml-4.0-schema
          curl -fsSL https://raw.githubusercontent.com/w3c-cg/musicxml/v4.0/schema/musicxml.xsd -o /tmp/musicxml-4.0-schema/musicxml.xsd
          curl -fsSL https://raw.githubusercontent.com/w3c-cg/musicxml/v4.0/schema/xml.xsd -o /tmp/musicxml-4.0-schema/xml.xsd
          curl -fsSL https://raw.githubusercontent.com/w3c-cg/musicxml/v4.0/schema/xlink.xsd -o /tmp/musicxml-4.0-schema/xlink.xsd
          python - <<'PY'
          from pathlib import Path
          schema = Path("/tmp/musicxml-4.0-schema/musicxml.xsd")
          content = schema.read_text(encoding="utf-8")
          content = content.replace("http://www.musicxml.org/xsd/xml.xsd", "xml.xsd")
          content = content.replace("http://www.musicxml.org/xsd/xlink.xsd", "xlink.xsd")
          schema.write_text(content, encoding="utf-8")
          PY
          python - <<'PY'
          from lxml import etree
          schema_path = "/tmp/musicxml-4.0-schema/musicxml.xsd"
          xml_path = "frontend/test-results/drumai-transcription.musicxml"
          schema = etree.XMLSchema(etree.parse(schema_path))
          document = etree.parse(xml_path)
          schema.assertValid(document)
          print(f"MusicXML 4.0 XSD validation passed: {xml_path}")
          PY
      - name: Import MusicXML and render with MuseScore 3
        run: |
          sudo apt-get update
          sudo apt-get install -y musescore3 xvfb poppler-utils
          musescore3 --version
          xvfb-run -a env SKIP_LIBJACK=1 musescore3 -o /tmp/drumai-musescore-render.pdf frontend/test-results/drumai-transcription.musicxml
          test -s /tmp/drumai-musescore-render.pdf
          pdfinfo /tmp/drumai-musescore-render.pdf | tee /tmp/drumai-musescore-pdfinfo.txt
          python - <<'PY'
          from pathlib import Path
          import re
          pdf = Path("/tmp/drumai-musescore-render.pdf")
          info = Path("/tmp/drumai-musescore-pdfinfo.txt").read_text(encoding="utf-8")
          match = re.search(r"^Pages:\\s+(\\d+)$", info, re.MULTILINE)
          if not match or int(match.group(1)) < 1:
              raise SystemExit("MuseScore did not produce a non-empty paginated score PDF")
          print(f"MuseScore import/render passed: pages={match.group(1)} bytes={pdf.stat().st_size}")
          PY
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
