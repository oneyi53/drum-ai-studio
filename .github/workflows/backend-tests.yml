name: Backend tests

on:
  pull_request:
    branches: [main, test/real-mp3-engine-smoke]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run backend unit tests
        run: pytest
      - name: Lint canonical-event and benchmark pipeline
        run: |
          ruff check app/drum_events.py app/evaluate_cli.py app/midi_adapter.py \
            app/midi_import_cli.py app/benchmark_cli.py \
            tests/test_drum_events.py tests/test_evaluate_cli.py tests/test_midi_adapter.py \
            tests/test_midi_import_cli.py tests/test_benchmark_cli.py
